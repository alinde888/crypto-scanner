name: Diagnose app

on:
  push:
    branches: [diag]

permissions:
  contents: write

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CORS
        run: |
          mkdir -p diag
          for u in \
            "https://api.dexscreener.com/token-profiles/latest/v1" \
            "https://api.dexscreener.com/token-boosts/latest/v1" \
            "https://api.dexscreener.com/latest/dex/search?q=WETH" \
            "https://api.dexscreener.com/tokens/v1/solana/JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN" \
            "https://api.dexscreener.com/token-pairs/v1/solana/JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN" \
            "https://api.gopluslabs.io/api/v1/token_security/1?contract_addresses=0x6982508145454ce325ddbe47a25d4ec3d2311933" \
            "https://api.gopluslabs.io/api/v1/solana/token_security?contract_addresses=JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN" ; do
            echo "== $u" >> diag/cors.txt
            curl -sS -m 20 -D - -o /dev/null -H "Origin: https://alinde888.github.io" "$u" | grep -i -E "^HTTP|access-control" >> diag/cors.txt || echo "failed" >> diag/cors.txt
          done
          curl -sS -m 20 "https://api.dexscreener.com/token-boosts/latest/v1" | head -c 1500 > diag/boosts.json || true
      - name: Store results
        run: |
          cd diag && git init -q && git checkout -q -b diag-results
          git config user.name "diag-bot" && git config user.email "diag@example.com"
          mkdir diag && mv *.txt *.json diag/ && git add diag && git commit -q -m "cors ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-results
