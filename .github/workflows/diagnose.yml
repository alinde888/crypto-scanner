name: Diagnose app

on:
  push:
    branches: [diag]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Screenshots
        run: |
          mkdir -p diag
          (cd web && python3 -m http.server 8080 > /dev/null 2>&1 &)
          npm i -s playwright@1.47.2 > /dev/null 2>&1
          npx -y playwright@1.47.2 install --with-deps chromium > /dev/null 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "fs";
          const b = await chromium.launch();
          const log = [];
          const ctx = await b.newContext({ viewport: { width: 1440, height: 1000 } });
          await ctx.addInitScript(() => localStorage.setItem("cryptoScanner.keys.v1", JSON.stringify({ anthropic: "test" })));
          await ctx.route("https://api.anthropic.com/v1/messages", async (route) => {
            const req = JSON.parse(route.request().postData());
            const text = req.messages[0].content;
            const data = JSON.parse(text.slice(text.indexOf("{")));
            log.push(`ai request tokens=${data.tokens.length}: ${data.tokens.map((t) => t.symbol).join(",")}`);
            const risks = ["high", "medium", "low"];
            const analyses = data.tokens.map((t, i) => ({ id: t.id, verdict: i < 3 ? "candidate" : i < 5 ? "watch" : "avoid", confidence: i === 2 ? 45 : 80 - i * 3, risk: risks[i % 3],
              headline: `Тест ${t.symbol}`, thesis: "Тестовый тезис.", positives: ["a"], risks: ["b"], timing: "сейчас", invalidation: "ниже старта" }));
            await route.fulfill({ status: 200, contentType: "application/json", headers: { "access-control-allow-origin": "*" },
              body: JSON.stringify({ content: [{ type: "tool_use", name: "report", input: { analyses } }], usage: { input_tokens: 5000, output_tokens: 1200 } }) });
          });
          const pg = await ctx.newPage();
          pg.on("pageerror", (e) => log.push(`pageerror: ${e.message}`));
          await pg.goto("http://localhost:8080/");
          await pg.waitForTimeout(90000);
          await pg.screenshot({ path: "diag/1-picks.png", fullPage: true });
          await b.close();
          fs.writeFileSync("diag/console.txt", log.join("\n") || "no log");
          JS
          node shot.mjs || echo "shot failed" >> diag/console.txt
      - name: Store results
        run: |
          cd diag && git init -q && git checkout -q -b diag-results
          git config user.name "diag-bot" && git config user.email "diag@example.com"
          mkdir d && mv *.* d/ && mv d diag && git add diag && git commit -q -m "web ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-results
