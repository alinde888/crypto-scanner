name: Diagnose app

on:
  push:
    branches: [diag]

permissions:
  contents: write

jobs:
  cors:
    runs-on: ubuntu-latest
    steps:
      - name: Probe wallet APIs
        run: |
          mkdir -p diag
          probe() { echo "== $1" >> diag/cors.txt; curl -sS -m 20 -D - -o diag/body.tmp -H "Origin: https://alinde888.github.io" "$1" | grep -i -E "^HTTP|access-control-allow-origin" >> diag/cors.txt; head -c 400 diag/body.tmp >> diag/cors.txt; echo >> diag/cors.txt; }
          probe "https://api.etherscan.io/v2/api?chainid=1&module=account&action=tokentx&address=0x28C6c06298d514Db089934071355E5743bf21d60&page=1&offset=1&apikey=x"
          probe "https://base.blockscout.com/api?module=account&action=tokentx&address=0x4200000000000000000000000000000000000006&page=1&offset=2"
          probe "https://base.blockscout.com/api?module=account&action=txlistinternal&address=0x3fC91A3afd70395Cd496C647d5a6CC9D4B2b7FAD&page=1&offset=2"
          probe "https://optimism.blockscout.com/api?module=account&action=tokentx&address=0x4200000000000000000000000000000000000006&page=1&offset=1"
          probe "https://api-mainnet.helius-rpc.com/v0/addresses/JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN/transactions?api-key=x"
          probe "https://api.helius.xyz/v0/addresses/JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN/transactions?api-key=x"
          echo "== preflight helius" >> diag/cors.txt
          curl -sS -m 20 -X OPTIONS -D - -o /dev/null -H "Origin: https://alinde888.github.io" -H "Access-Control-Request-Method: GET" "https://api-mainnet.helius-rpc.com/v0/addresses/x/transactions" | grep -i -E "^HTTP|access-control" >> diag/cors.txt
          rm -f diag/body.tmp
      - name: Store results
        run: |
          cd diag && git init -q && git checkout -q -b diag-results
          git config user.name "diag-bot" && git config user.email "diag@example.com"
          mkdir d && mv *.* d/ && mv d diag && git add diag && git commit -q -m "cors2 ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-results
