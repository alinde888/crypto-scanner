name: Diagnose app

on:
  push:
    branches: [diag]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir -p diag
          probe() { echo "== $1" >> diag/cors.txt; curl -sS -m 20 -D - -o diag/body.tmp -H "Origin: https://alinde888.github.io" -H "Accept: application/json" "$1" | grep -i -E "^HTTP|access-control-allow-origin|x-ratelimit" >> diag/cors.txt; }
          probe "https://api.geckoterminal.com/api/v2/networks/solana/trending_pools?page=1"
          cp diag/body.tmp diag/gt_trending.json
          probe "https://api.geckoterminal.com/api/v2/networks/eth/new_pools?page=1"
          cp diag/body.tmp diag/gt_new.json
          probe "https://api.geckoterminal.com/api/v2/networks?page=1"
          cp diag/body.tmp diag/gt_networks.json
          probe "https://api.geckoterminal.com/api/v2/networks/solana/pools?page=1&sort=h24_volume_usd_desc"
          echo "== anthropic preflight" >> diag/cors.txt
          curl -sS -m 20 -X OPTIONS -D - -o /dev/null -H "Origin: https://alinde888.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: content-type,x-api-key,anthropic-version,anthropic-dangerous-direct-browser-access" https://api.anthropic.com/v1/messages | grep -i -E "^HTTP|access-control" >> diag/cors.txt
          echo "== anthropic post" >> diag/cors.txt
          curl -sS -m 20 -D - -o diag/body.tmp -X POST -H "Origin: https://alinde888.github.io" -H "content-type: application/json" -H "x-api-key: x" -H "anthropic-version: 2023-06-01" -H "anthropic-dangerous-direct-browser-access: true" -d '{"model":"claude-haiku-5-5","max_tokens":5,"messages":[{"role":"user","content":"hi"}]}' https://api.anthropic.com/v1/messages | grep -i -E "^HTTP|access-control-allow-origin" >> diag/cors.txt
          head -c 300 diag/body.tmp >> diag/cors.txt
          rm -f diag/body.tmp
          python3 - <<'PY'
          import json
          d=json.load(open("diag/gt_networks.json"))
          print(json.dumps([[x["id"],x["attributes"]["name"]] for x in d["data"]])[:3000], file=open("diag/nets.txt","w"))
          t=json.load(open("diag/gt_trending.json"))
          print(json.dumps(t["data"][0], indent=1)[:4000], file=open("diag/gt_sample.txt","w"))
          PY
      - name: Store results
        run: |
          cd diag && git init -q && git checkout -q -b diag-results
          git config user.name "diag-bot" && git config user.email "diag@example.com"
          mkdir d && mv *.* d/ && mv d diag && git add diag && git commit -q -m "probe ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-results
