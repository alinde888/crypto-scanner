name: Diagnose app

on:
  push:
    branches: [diag]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Screenshots
        run: |
          mkdir -p diag
          (cd web && python3 -m http.server 8080 > /dev/null 2>&1 &)
          npm i -s playwright@1.47.2 > /dev/null 2>&1
          npx -y playwright@1.47.2 install --with-deps chromium > /dev/null 2>&1
          cat > shot.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "fs";
          const b = await chromium.launch();
          const log = [];
          const ctx = await b.newContext({ viewport: { width: 1440, height: 900 } });
          await ctx.addInitScript(() => {
            const W = (chain, wallet, o) => ({ chain, wallet, grade: "weak", winRate: 0.6, wins: 6, tokens: 10, pnl: 1500, roi: 0.4, topShare: 0.3, isBot: false, medianHold: 3600e3, flags: [], hits: [{ token: "x", symbol: "PEPE", ts: 1 }], analyzedAt: Date.now(), ...o });
            const wallets = {
              "solana:a1": W("solana", "A1aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"),
              "solana:a2": W("solana", "A2aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", { tokens: 6, wins: 3, winRate: 0.5, pnl: 300, roi: 0.12 }),
              "solana:a3": W("solana", "A3aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", { tokens: 1, wins: 1, winRate: 1, pnl: 900, roi: 3 }),
              "ethereum:0xb1": W("ethereum", "0xb100000000000000000000000000000000000001", { pnl: -500, roi: -0.2 }),
              "ethereum:0xb2": W("ethereum", "0xb200000000000000000000000000000000000002", { tokens: 12, wins: 8, winRate: 0.66, pnl: 4200, roi: 0.8 }),
            };
            localStorage.setItem("cryptoScanner.smart.v1", JSON.stringify({ scanned: {}, wallets, day: null, used: { solana: 2, evm: 1 }, log: [] }));
            localStorage.setItem("cryptoScanner.settings.v1", JSON.stringify({ smartAuto: false }));
          });
          const pg = await ctx.newPage();
          pg.on("pageerror", (e) => log.push(`pageerror: ${e.message}`));
          await pg.goto("http://localhost:8080/#wallets");
          await pg.waitForTimeout(4000);
          await pg.screenshot({ path: "diag/1-strong.png" });
          await pg.click("[data-action='lb-view'][data-value='all']"); await pg.waitForTimeout(800);
          await pg.screenshot({ path: "diag/2-all.png" });
          await pg.click("[data-action='lb-chain'][data-value='ethereum']"); await pg.waitForTimeout(800);
          await pg.screenshot({ path: "diag/3-eth.png" });
          await b.close();
          fs.writeFileSync("diag/console.txt", log.join("\n") || "no errors");
          JS
          node shot.mjs || echo "shot failed" >> diag/console.txt
      - name: Store results
        run: |
          cd diag && git init -q && git checkout -q -b diag-results
          git config user.name "diag-bot" && git config user.email "diag@example.com"
          mkdir d && mv *.* d/ && mv d diag && git add diag && git commit -q -m "web ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-results
