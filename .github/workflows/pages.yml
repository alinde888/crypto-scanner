name: Publish web app

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push web/ to gh-pages
        run: |
          cd web
          touch .nojekyll
          V=$(echo "${{ github.sha }}" | cut -c1-8)
          # Version every file reference so browsers never mix old and new modules.
          sed -i -E "s#(from \"\./[A-Za-z]+\.js)\"#\1?v=$V\"#g" js/*.js
          sed -i -E "s#js/app\.js\"#js/app.js?v=$V\"#; s#styles\.css\"#styles.css?v=$V\"#" index.html
          sed -i "s#__BUILD__#$V#" index.html
          grep -c "?v=$V" js/app.js index.html
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Publish ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
